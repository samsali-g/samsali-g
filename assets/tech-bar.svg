<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 84" width="100%" height="84" role="img" aria-label="Animated geometric tech divider">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect x="2" y="8" width="996" height="68" rx="14" fill="#080D1A" stroke="#1E293B" stroke-width="1.4"/>

  <!-- Traveling Neon Pulse Line -->
  <line x1="30" y1="76" x2="970" y2="76" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="140 860">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="5s" repeatCount="indefinite"/>
  </line>

  <!-- Rotating Shapes + Stack Labels -->
  <g transform="translate(55, 42)">
    <polygon points="0,-10 9,6 -9,6" fill="none" stroke="#00F5D4" stroke-width="1.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <text x="20" y="5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700">TypeScript</text>
  </g>

  <g transform="translate(205, 42)">
    <rect x="-8" y="-8" width="16" height="16" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700">WebAssembly</text>
  </g>

  <g transform="translate(370, 42)">
    <polygon points="0,-10 8.6,-5 8.6,5 0,10 -8.6,5 -8.6,-5" fill="none" stroke="#F59E0B" stroke-width="1.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </polygon>
    <text x="20" y="5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700">Three.js / GLSL</text>
  </g>

  <g transform="translate(560, 42)">
    <polygon points="0,-10 10,0 0,10 -10,0" fill="none" stroke="#F43F5E" stroke-width="1.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="7s" repeatCount="indefinite"/>
    </polygon>
    <text x="20" y="5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700">Astro &amp; Next.js</text>
  </g>

  <g transform="translate(755, 42)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#10B981" stroke-width="1.8" stroke-dasharray="8 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3" fill="#10B981"/>
    <text x="20" y="5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700">Cloudflare Edge</text>
  </g>
</svg>
