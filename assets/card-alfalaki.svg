<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" width="320" height="170" role="img" aria-label="Alfalaki">
  <defs>
    <linearGradient id="astroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D1A"/>
      <stop offset="100%" stop-color="#17162B"/>
    </linearGradient>
    <linearGradient id="astroStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="316" height="166" rx="14" fill="url(#astroBg)" stroke="url(#astroStroke)" stroke-width="1.8"/>

  <!-- Animated Planetary Orbit Icon -->
  <g transform="translate(272, 42)">
    <circle cx="0" cy="0" r="23" fill="none" stroke="#38BDF8" stroke-width="1.1" stroke-opacity="0.45"/>
