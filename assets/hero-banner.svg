<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="250" role="img" aria-label="samsali-g animated banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913">
        <animate attributeName="stop-color" values="#060913;#091322;#07161B;#060913" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#0B1325"/>
      <stop offset="100%" stop-color="#071B1E">
        <animate attributeName="stop-color" values="#071B1E;#131B2E;#0B221D;#071B1E" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="borderFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4">
        <animate attributeName="stop-color" values="#00F5D4;#38BDF8;#F59E0B;#F43F5E;#00F5D4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#F59E0B">
        <animate attributeName="stop-color" values="#F59E0B;#F43F5E;#00F5D4;#38BDF8;#F59E0B" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#00F5D4;#10B981;#F59E0B;#38BDF8" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#7DD3FC">
        <animate attributeName="offset" values="0.25;0.75;0.25" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>

    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.0"/>
      <stop offset="40%" stop-color="#00F5D4" stop-opacity="0.22"/>
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="waveGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="85%" stop-color="#F43F5E" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.0"/>
    </linearGradient>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="996" height="246" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1000" height="250" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1000" height="250" fill="url(#cyberGrid)"/>

    <!-- Morphing Aurora Waves -->
    <path fill="url(#waveCyan)">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,190 C220,130 420,235 660,165 C820,120 920,175 1000,150 L1000,250 L0,250 Z;
                M0,165 C240,225 450,120 680,190 C830,225 930,140 1000,175 L1000,250 L0,250 Z;
                M0,190 C220,130 420,235 660,165 C820,120 920,175 1000,150 L1000,250 L0,250 Z"/>
    </path>
    <path fill="url(#waveGold)">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M0,215 C260,165 480,240 720,180 C860,145 940,205 1000,185 L1000,250 L0,250 Z;
                M0,195 C250,235 510,150 740,205 C880,235 950,165 1000,200 L1000,250 L0,250 Z;
                M0,215 C260,165 480,240 720,180 C860,145 940,205 1000,185 L1000,250 L0,250 Z"/>
    </path>

    <!-- Floating Geometric Particles -->
    <g opacity="0.65">
      <polygon points="560,42 570,58 550,58" fill="none" stroke="#00F5D4" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate" from="0 560 52" to="360 560 52" dur="14s" repeatCount="indefinite"/>
      </polygon>
      <rect x="635" y="185" width="14" height="14" rx="2" fill="none" stroke="#F59E0B" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate" from="360 642 192" to="0 642 192" dur="11s" repeatCount="indefinite"/>
      </rect>
      <polygon points="485,195 493,203 485,211 477,203" fill="none" stroke="#F43F5E" stroke-width="1.5">
        <animate attributeName="opacity" values="0.25;0.95;0.25" dur="4s" repeatCount="indefinite"/>
      </polygon>
      <circle cx="690" cy="48" r="3" fill="#38BDF8">
        <animate attributeName="r" values="2;5;2" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Right-Side Sacred Geometric Gyroscope -->
    <g transform="translate(835, 125)">
      <!-- Outer Dashed Ring -->
      <circle cx="0" cy="0" r="88" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.55">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      </circle>
      <!-- Counter-Rotating Cyan Ring -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#00F5D4" stroke-width="1.5" stroke-dasharray="32 14 8 14" opacity="0.75">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="19s" repeatCount="indefinite"/>
      </circle>
      <!-- Rotating Hexagon -->
      <polygon points="0,-54 46.8,-27 46.8,27 0,54 -46.8,27 -46.8,-27" fill="none" stroke="#F59E0B" stroke-width="1.6" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      </polygon>
      <!-- Counter-Rotating Square Star -->
      <rect x="-32" y="-32" width="64" height="64" fill="none" stroke="#F43F5E" stroke-width="1.4" opacity="0.75">
        <animateTransform attributeName="transform" type="rotate" from="45" to="-315" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="-32" y="-32" width="64" height="64" fill="none" stroke="#00F5D4" stroke-width="1.4" opacity="0.75">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </rect>
      <!-- Orbiting Planet Nodes -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
        <circle cx="70" cy="0" r="5" fill="#00F5D4"/>
        <circle cx="-70" cy="0" r="4" fill="#F59E0B"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="13s" repeatCount="indefinite"/>
        <circle cx="0" cy="-88" r="4.5" fill="#F43F5E"/>
      </g>
      <!-- Pulsing Core -->
      <circle cx="0" cy="0" r="10" fill="#00F5D4" opacity="0.25">
        <animate attributeName="r" values="9;18;9" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Left Content Block -->
    <g transform="translate(52, 50)">
      <!-- Live Pill -->
      <rect x="0" y="0" width="320" height="26" rx="13" fill="#0F172A" stroke="#00F5D4" stroke-width="1" stroke-opacity="0.45"/>
      <circle cx="16" cy="13" r="4.5" fill="#10B981">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="17" fill="#A7F3D0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2">CLIENT-SIDE · ZERO-UPLOAD · EDGE</text>

      <!-- Handle Headline -->
      <text x="0" y="82" fill="url(#titleGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.8">@samsali-g</text>

      <!-- Subtitle -->
      <text x="2" y="114" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">High-precision browser tools built with WebAssembly, WebGL &amp; Edge SSR.</text>

      <!-- Animated Spectrum Bars + Tags -->
      <g transform="translate(2, 138)">
        <rect x="0" y="6" width="5" height="14" rx="2.5" fill="#00F5D4">
          <animate attributeName="height" values="6;20;6" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="y" values="14;0;14" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="9" y="2" width="5" height="18" rx="2.5" fill="#38BDF8">
          <animate attributeName="height" values="18;7;18" dur="1.0s" repeatCount="indefinite"/>
          <animate attributeName="y" values="2;13;2" dur="1.0s" repeatCount="indefinite"/>
        </rect>
        <rect x="18" y="8" width="5" height="12" rx="2.5" fill="#F59E0B">
          <animate attributeName="height" values="8;20;8" dur="1.4s" repeatCount="indefinite"/>
          <animate attributeName="y" values="12;0;12" dur="1.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="27" y="4" width="5" height="16" rx="2.5" fill="#F43F5E">
          <animate attributeName="height" values="16;5;16" dur="1.1s" repeatCount="indefinite"/>
          <animate attributeName="y" values="4;15;4" dur="1.1s" repeatCount="indefinite"/>
        </rect>
        <rect x="36" y="7" width="5" height="13" rx="2.5" fill="#10B981">
          <animate attributeName="height" values="7;19;7" dur="1.3s" repeatCount="indefinite"/>
          <animate attributeName="y" values="13;1;13" dur="1.3s" repeatCount="indefinite"/>
        </rect>

        <text x="54" y="15" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="600">WASM · Three.js · Astro · Next.js · TypeScript · Cloudflare</text>
      </g>
    </g>
  </g>

  <!-- Animated Neon Border -->
  <rect x="2" y="2" width="996" height="246" rx="18" fill="none" stroke="url(#borderFlow)" stroke-width="2.2"/>
</svg>
